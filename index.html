<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101110" />
    <title>Jakub Chyžnaj — Motivačné video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #101110; color: #f3f3ef; font-family: "DM Sans", Arial, sans-serif; }
      main { width: min(100% - 40px, 1000px); margin: 0 auto; padding: 32px 0; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      h1 { margin: 0; font-size: 21px; font-weight: 500; letter-spacing: -.5px; }
      p { margin: 0; font-size: 13px; color: #a5a8a2; }
      video { display: block; width: 100%; height: min(80svh, 960px); background: #000; border-radius: 12px; object-fit: contain; box-shadow: 0 20px 80px #0005; }
      video:focus-visible { outline: 2px solid #dfd69d; outline-offset: 4px; }
      footer { margin-top: 18px; font-size: 13px; }
      a { color: #b3b7ae; text-underline-offset: 4px; }
      .cv-button { display: inline-flex; align-items: center; padding: 10px 18px; border: 1px solid #50534c; border-radius: 8px; color: #f3f3ef; font-size: 14px; font-weight: 500; text-decoration: none; transition: background .18s, border-color .18s; }
      .cv-button:hover { background: #242720; border-color: #919987; }
      .cv-button:focus-visible { outline: 2px solid #dfd69d; outline-offset: 4px; }
      @media (max-width: 520px) { main { width: calc(100% - 24px); padding: 22px 0; } header { gap: 12px; } p { margin-top: 7px; } video { height: 76svh; } }
    </style>
  </head>
  <body>
    <main>
      <header><h1>Jakub Chyžnaj</h1><a class="cv-button" href="./CVcko.pdf" target="_blank" rel="noopener noreferrer">View CV</a></header>
      <video controls playsinline preload="metadata" aria-label="Motivačné video Jakuba Chyžnaja">
        <source src="./jakub_chyznaj_motivacne_video.mp4" type="video/mp4" />
        Váš prehliadač nepodporuje prehrávanie videa. <a href="./jakub_chyznaj_motivacne_video.mp4">Stiahnuť video</a>
      </video>
      <footer><a href="./jakub_chyznaj_motivacne_video.mp4" download>Stiahnuť video</a></footer>
    </main>
  </body>
</html>
